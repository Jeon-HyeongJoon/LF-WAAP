[project]
name = "lf-waap"
version = "0.1.0"
description = "POC WAF — rule-set + HMM based block decision (DDD core)"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "hmmlearn>=0.3.2",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML",
]
# 스트리밍 파이프(Kafka) 실행용. 코어/테스트는 이것 없이도 동작(InMemoryChannel).
kafka = [
    "kafka-python>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/waf"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests", "learning_data"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["hmmlearn.*", "sklearn.*", "scipy.*", "kafka.*"]
ignore_missing_imports = true
