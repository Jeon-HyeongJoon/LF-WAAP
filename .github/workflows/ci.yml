name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run lint
        run: python -m ruff check .

      - name: Run type check
        run: python -m mypy src learning_data

      - name: Run tests
        run: python -m pytest -q

      - name: Run CSIC MVP smoke
        run: python scripts/ci_csic_mvp.py --output-dir reports/ci/csic-mvp

      - name: Run HMM / Hybrid benchmark
        run: python scripts/ci_hmm_benchmark.py --output-dir reports/ci

      - name: Publish benchmark summary
        if: always()
        run: |
          if [ -f reports/ci/csic-mvp/csic_mvp_summary.md ]; then
            cat reports/ci/csic-mvp/csic_mvp_summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f reports/ci/summary.md ]; then
            cat reports/ci/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hmm-hybrid-benchmark
          path: reports/ci/
          if-no-files-found: error
